plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

apply plugin: 'net.fabricmc.fabric-loom-remap'

group = project.maven_group
version = project.mod_version
base {
	archivesName = "${project.archives_base_name}-1.21.11"
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cord_clipper" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDir 'src/shared/java'
	}
	client {
		java.setSrcDirs(['src/targets/1.21.11/java'])
	}
}

def selectedFabricApi = project.findProperty('fabric_api_override_root') ?: project.fabric_api_version
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${selectedFabricApi}"
}

def modVersion = project.version
def minecraftDependency = project.minecraft_dependency
def javaDependency = project.java_dependency
processResources {
	inputs.property "version", modVersion
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "java_dependency", javaDependency
	from(layout.projectDirectory.file('LICENSE')) {
		into 'META-INF'
	}

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_dependency": minecraftDependency,
				"java_dependency": javaDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('sourcesJar') {
	from(layout.projectDirectory.file('LICENSE')) {
		into 'META-INF'
	}
}

jar {
	inputs.property "projectName", project.name
}

tasks.named('build') {
	dependsOn subprojects.collect { "${it.path}:build" }
}
