pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'cord-clipper'

include 'mc1214', 'mc261', 'mc2611', 'mc2612', 'mc262', 'mc263', 'mc264beta'

project(':mc1214').projectDir = file('targets/mc1214')
project(':mc261').projectDir = file('targets/mc261')
project(':mc2611').projectDir = file('targets/mc2611')
project(':mc2612').projectDir = file('targets/mc2612')
project(':mc262').projectDir = file('targets/mc262')
project(':mc263').projectDir = file('targets/mc263')
project(':mc264beta').projectDir = file('targets/mc264beta')
